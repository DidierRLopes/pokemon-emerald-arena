# Deploy the browser player (play/) to GitHub Pages. Runs only when started by
# hand, and needs Pages set to "GitHub Actions" in the repository settings.
name: Deploy browser player
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-play.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: play/dist
      - id: deploy
        uses: actions/deploy-pages@v4
